[project]
name = "lab"
version = "0.1.0"
description = "Quant Research Lab: infrastruttura di ricerca quantitativa"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
